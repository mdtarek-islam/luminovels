<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="t d">
  <title id="t">LumiNovels train and benchmark flow</title>
  <desc id="d">The cached CSV passes through TextPipeline and an 80:20 split. TfidfVectoriser and ChiSquareSelector fit on the training part only. The two-layer NeuralNetwork trains in softmax or sigmoid mode. The held-out part and the network feed the benchmark, which writes its scores to docs/local.</desc>
  <style>
    .bg { fill: #0d1117; }
    .node { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .focus { stroke: #58a6ff; }
    .out { stroke: #3fb950; }
    .name { fill: #e6edf3; font: 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sub { fill: #8b949e; font: 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .head { fill: #e6edf3; font: 16px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .wire { fill: none; stroke: #30363d; stroke-width: 2; }
    .flow { fill: none; stroke: #58a6ff; stroke-width: 2; stroke-dasharray: 10 90; stroke-dashoffset: 100; animation: pulse 4s linear infinite; }
    .d1 { animation-delay: 0s; }
    .d2 { animation-delay: 0.5s; }
    .d3 { animation-delay: 1s; }
    .d4 { animation-delay: 1.5s; }
    .d5 { animation-delay: 2s; }
    .d6 { animation-delay: 2.5s; }
    .d7 { animation-delay: 3s; }
    .arrow { fill: #58a6ff; }
    .arrow-out { fill: #3fb950; }
    @keyframes pulse { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow { animation: none; stroke-dasharray: none; stroke-dashoffset: 0; opacity: 0.6; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="960" height="400"/>
  <text class="head" x="22" y="40">Train and benchmark flow</text>
  <text class="sub" x="22" y="62">Split first. Fit on the training part only. Score the held-out part.</text>

  <!-- base wires -->
  <path class="wire" d="M170 122 H214"/>
  <path class="wire" d="M362 122 H406"/>
  <path class="wire" d="M554 122 H598"/>
  <path class="wire" d="M746 122 H790"/>
  <path class="wire" d="M480 154 V214 H820 V250"/>
  <path class="wire" d="M864 154 V250"/>
  <path class="wire" d="M790 282 H746"/>
  <path class="wire" d="M598 282 H554"/>

  <!-- animated pulses, pathLength 100 -->
  <path class="flow d1" pathLength="100" d="M170 122 H214"/>
  <path class="flow d2" pathLength="100" d="M362 122 H406"/>
  <path class="flow d3" pathLength="100" d="M554 122 H598"/>
  <path class="flow d4" pathLength="100" d="M746 122 H790"/>
  <path class="flow d4" pathLength="100" d="M480 154 V214 H820 V250"/>
  <path class="flow d5" pathLength="100" d="M864 154 V250"/>
  <path class="flow d6" pathLength="100" d="M790 282 H746"/>
  <path class="flow d7" pathLength="100" d="M598 282 H554"/>

  <!-- arrow heads -->
  <path class="arrow" d="M214 122 l-6 -4 v8 z"/>
  <path class="arrow" d="M406 122 l-6 -4 v8 z"/>
  <path class="arrow" d="M598 122 l-6 -4 v8 z"/>
  <path class="arrow" d="M790 122 l-6 -4 v8 z"/>
  <path class="arrow" d="M820 250 l-4 -6 h8 z"/>
  <path class="arrow" d="M864 250 l-4 -6 h8 z"/>
  <path class="arrow" d="M746 282 l6 -4 v8 z"/>
  <path class="arrow-out" d="M554 282 l6 -4 v8 z"/>

  <text class="sub" x="490" y="206">held-out 20%</text>
  <text class="sub" x="560" y="106">train 80%</text>
  <text class="sub" x="716" y="236">trained network</text>

  <!-- row 1 -->
  <rect class="node" x="22" y="90" width="148" height="64" rx="6"/>
  <text class="name" x="34" y="116">LightNovels.csv</text>
  <text class="sub" x="34" y="138">written by ingest</text>

  <rect class="node" x="214" y="90" width="148" height="64" rx="6"/>
  <text class="name" x="226" y="116">TextPipeline</text>
  <text class="sub" x="226" y="138">Corpus.load, clean</text>

  <rect class="node focus" x="406" y="90" width="148" height="64" rx="6"/>
  <text class="name" x="418" y="116">Split 80:20</text>
  <text class="sub" x="418" y="138">before any fitting</text>

  <rect class="node" x="598" y="90" width="148" height="64" rx="6"/>
  <text class="name" x="610" y="116">TfidfVectoriser</text>
  <text class="sub" x="610" y="138">+ ChiSquareSelector</text>

  <rect class="node focus" x="790" y="90" width="148" height="64" rx="6"/>
  <text class="name" x="802" y="116">NeuralNetwork</text>
  <text class="sub" x="802" y="138">2 layers, SGD</text>

  <!-- row 2 -->
  <rect class="node" x="790" y="250" width="148" height="64" rx="6"/>
  <text class="name" x="802" y="276">benchmark</text>
  <text class="sub" x="802" y="298">softmax and sigmoid</text>

  <rect class="node" x="598" y="250" width="148" height="64" rx="6"/>
  <text class="name" x="610" y="276">Scores</text>
  <text class="sub" x="610" y="298">F1, exact match, latency</text>

  <rect class="node out" x="406" y="250" width="148" height="64" rx="6"/>
  <text class="name" x="418" y="276">docs/local/</text>
  <text class="sub" x="418" y="298">local only</text>

  <text class="sub" x="22" y="372">TfidfVectoriser and ChiSquareSelector see no test row. The held-out part is only transformed.</text>
</svg>
